<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija's Numbers</title>
<meta name="description" content="A daily Nigerian number-guessing game. Five questions, closer guesses go further through the go-slow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Pixel-art traffic jam crossing Nigerian cities"></canvas>

  <div class="hud">
    <div class="brand">
      <b>NAIJA'S NUMBERS</b>
      <div class="where" id="where">LAGOS</div>
      <span id="wxChip"></span>
    </div>
    <div class="pips" id="pips"></div>
    <div class="score"><strong id="score">0</strong><small id="maxTotal">OF 1,900</small><div class="chips"><button id="muteChip" type="button" aria-label="Sound on or off" aria-pressed="false"><i></i><span>SOUND</span></button><button id="nightChip" type="button" aria-label="Switch between day and night"><i></i><span>DAY</span></button></div></div>
  </div>

  <div id="qBox" hidden>
    <div class="qcard">
      <span id="qCat"></span>
      <p id="qText"></p>
    </div>
  </div>

  <div id="card" hidden><i id="cardDot"></i><span id="cardBand"></span><span id="cardPts"></span></div>


  <div id="intro">
    <div class="logoBox"><canvas id="logo" role="img" aria-label="Naija's Numbers"></canvas></div>
    <button id="startBtn">Take today's journey</button>
  </div>

  <div id="panel">
    <div class="wrap">
      <div id="startView">
        <p class="howto" id="howto"></p>
      </div>
      <div id="qView" hidden>
        <div style="display:grid;gap:6px">
          <div class="qtop"><span id="qNum">QUESTION 1 OF 5</span><span id="clock">18</span></div>
          <div class="bar"><i id="barFill"></i></div>
        </div>
        <form id="guessForm" autocomplete="off">
          <input id="guess" inputmode="decimal" placeholder="Your guess" aria-label="Your guess">
          <button type="submit">Lock in</button>
        </form>
        <p id="guessHint"></p>
      </div>
      <div id="revView" hidden>
        <div class="reveal">
          <div><span>Your guess</span><strong id="revGuess"></strong></div>
          <div><span>Answer</span><strong id="revAnswer"></strong></div>
        </div>
        <p id="revOff"></p>
        <p id="revSrc"></p>
        <button id="pressOn" disabled>Press on →</button>
      </div>
    </div>
  </div>

  <div id="result" hidden>
    <div class="res">
      <h2 id="resTitle"></h2>
      <p class="tot" id="resTot">0<small> / 1,900</small></p>
      <p class="tap" id="resTap"></p>
      <ol id="resList"></ol>
      <p class="far" id="resFar"></p>
      <button id="shareBtn">Share score</button>
      <p class="copied" id="copied" hidden></p>
      <p class="next"><span id="countdown"></span><br><span id="resStats"></span></p>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
